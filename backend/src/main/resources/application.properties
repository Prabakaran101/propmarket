spring.application.name=realestate-backend

# ── Database ───────────────────────────────────────────────
# Override with environment variables when running on EC2
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/realestatedb}
spring.datasource.username=${DB_USERNAME:realestate}
spring.datasource.password=${DB_PASSWORD:realestate123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:RealEstateSecretKey2024VeryLongAndSecureKeyForJWT}
jwt.expiration=86400000

# ── File Upload ────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload.dir=${UPLOAD_DIR:/app/uploads}

# ── Server ─────────────────────────────────────────────────
server.port=8080

# ── CORS ───────────────────────────────────────────────────
# Accepts comma-separated origins including EC2 public IP
# Set CORS_ORIGINS env var when running on EC2 e.g.:
#   -e CORS_ORIGINS=http://54.123.45.67
cors.allowed.origins=${CORS_ORIGINS:http://localhost,http://localhost:3000}

# ── Actuator health endpoint ───────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Logging ────────────────────────────────────────────────
logging.level.com.realestate=INFO
logging.level.org.springframework.security=WARN
