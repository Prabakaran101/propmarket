# ──────────────────────────────────────────────────────────
#  Nginx config for React SPA + Backend API Proxy
#
#  When running on EC2:
#   - Frontend container listens on port 80
#   - Nginx proxies /api/* and /uploads/* to the backend container
#   - Backend container name on Docker network = "realestate-backend"
#     (use the --name flag when running docker run)
# ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Health check — used by Docker HEALTHCHECK and Jenkins
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Proxy all /api/* calls → Spring Boot backend container
    location /api/ {
        proxy_pass         http://realestate-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # Proxy uploaded property images → backend container
    location /uploads/ {
        proxy_pass       http://realestate-backend:8080/uploads/;
        proxy_set_header Host $host;
    }

    # All other requests → React SPA (index.html handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
